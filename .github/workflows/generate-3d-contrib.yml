name: Generate 3D Contribution Visualization

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (use PAT for push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Generate 3D contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/generate-3d-contrib.js

      - name: Debug show working dir file and git status
        run: |
          echo "PWD: $(pwd)"
          echo "List root:"
          ls -la
          echo "List repo dir:"
          ls -la $GITHUB_WORKSPACE || true
          echo "List profile-3d-contrib:"
          ls -la profile-3d-contrib || true
          if [ -f profile-3d-contrib/profile-green-animate.svg ]; then
            echo "File exists, show head:"
            head -n 20 profile-3d-contrib/profile-green-animate.svg
          else
            echo "file not found"
          fi
          echo "Git status porcelain:"
          git status --porcelain || true
          echo "Git diff for file:"
          git --no-pager diff -- profile-3d-contrib/profile-green-animate.svg || true

      - name: Configure git to use PAT for push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git fetch origin

      - name: Commit and push changes
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config --local user.email "$GIT_AUTHOR_EMAIL"
          git config --local user.name "$GIT_AUTHOR_NAME"
          git add profile-3d-contrib/profile-green-animate.svg || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update 3D contribution visualization"
            git push origin HEAD:${{ github.ref_name }}
          fi
